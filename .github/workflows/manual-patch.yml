name: Manual Patch and Update

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App to patch'
        required: true
        type: choice
        options:
          - youtube
          - youtube-music
          - brave
          - gboard
          - vivaldi
          - microsoft-edge
          - windy
          - camscanner
          - tiktok
          - hill-climb-racing
          - jetpack-joyride
        default: 'youtube'

      update_release:
        description: 'Update latest release'
        required: true
        type: boolean
        default: false

jobs:
  manual-patch:
    runs-on: ubuntu-latest

    services:
      trawl:
        image: ghcr.io/germondai/trawl:latest
        ports:
          - 8191:8191
        options: --shm-size=1gb

    permissions:
      contents: write

    steps:
      # ========================================
      # Checkout Repository
      # ========================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ========================================
      # Determine App Configuration
      # ========================================

      - name: Determine App Configuration
        id: config
        run: |
          python - <<'PY'
          import json
          import os

          app = "${{ inputs.app_name }}"

          # Get source from patch-config.json
          with open("patch-config.json", "r", encoding="utf-8") as f:
              patch_config = json.load(f)

          source_entry = next(
              (
                  item
                  for item in patch_config["patch_list"]
                  if item["app_name"] == app
              ),
              None
          )

          if source_entry is None:
              raise SystemExit(
                  f"❌ No source configuration found for {app}"
              )

          source = source_entry["source"]

          # Get architecture from arch-config.json
          with open("arch-config.json", "r", encoding="utf-8") as f:
              arch_config = json.load(f)

          arch_entry = next(
              (
                  item
                  for item in arch_config
                  if item["app_name"] == app
              ),
              None
          )

          if arch_entry is None:
              raise SystemExit(
                  f"❌ No architecture configuration found for {app}"
              )

          arches = arch_entry["arches"]

          if len(arches) != 1:
              raise SystemExit(
                  f"❌ Expected exactly one architecture for {app}, "
                  f"found: {arches}"
              )

          architecture = arches[0]

          print("========================================")
          print(f"App:          {app}")
          print(f"Source:       {source}")
          print(f"Architecture: {architecture}")
          print("Version:      Automatic")
          print("========================================")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"source={source}\n")
              f.write(f"architecture={architecture}\n")
          PY

      # ========================================
      # Install Python
      # ========================================

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      # ========================================
      # Install Dependencies
      # ========================================

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install requests beautifulsoup4

      # ========================================
      # Setup Java 21
      # ========================================

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ========================================
      # Build APK
      # ========================================

      - name: Build APK
        env:
          APP_NAME: ${{ inputs.app_name }}
          SOURCE: ${{ steps.config.outputs.source }}
          ARCH: ${{ steps.config.outputs.architecture }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRAWL_URL: http://localhost:8191
        run: |
          echo "========================================"
          echo "🔧 Building $APP_NAME"
          echo "📦 Source: $SOURCE"
          echo "🏗️ Architecture: $ARCH"
          echo "🎯 Version: Automatic"
          echo "========================================"
          echo ""

          python -m src

      # ========================================
      # Find Built APK
      # ========================================

      - name: Find Built APK
        id: find-apk
        run: |
          apk_files=$(find . -maxdepth 1 -type f -name "*.apk" -printf "%f\n")

          if [ -z "$apk_files" ]; then
            echo "❌ No APK files found"
            exit 1
          fi

          {
            echo "apk_files<<EOF"
            echo "$apk_files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "apk_count=$(echo "$apk_files" | wc -l)" >> "$GITHUB_OUTPUT"

          echo "📦 Found these APKs:"
          echo "$apk_files"

      # ========================================
      # Record Build Output
      # ========================================

      - name: Record Build Output
        env:
          APP_NAME: ${{ inputs.app_name }}
          SOURCE: ${{ steps.config.outputs.source }}
        run: |
          mkdir -p build_records

          for apk in ./*.apk; do
            [ -f "$apk" ] || continue

            APK_PATH="$apk" \
            python scripts/record_build.py
          done

          echo "Build records:"
          ls -lah build_records/

      # ========================================
      # Upload APK as Artifact
      # ========================================

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-${{ steps.config.outputs.architecture }}
          path: "*.apk"
          if-no-files-found: error
          retention-days: 7

      # ========================================
      # Check Existing Release
      # ========================================

      - name: Check Existing Release
        if: ${{ inputs.update_release == true }}
        id: check-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            echo "✅ Release 'latest' exists"
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "ℹ️ Release 'latest' does not exist"
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      # ========================================
      # Generate Release Notes
      # ========================================

      - name: Generate Release Notes
        if: ${{ inputs.update_release == true }}
        run: |
          echo "📝 Generating release notes..."

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          APP_NAMES = {
              "youtube": "YouTube",
              "youtube-music": "YT-Music",
              "brave": "Brave",
              "gboard": "Gboard",
              "vivaldi": "Vivaldi",
              "microsoft-edge": "Microsoft Edge",
              "windy": "Windy",
              "camscanner": "CamScanner",
              "tiktok": "TikTok",
              "hill-climb-racing": "Hill Climb Racing",
              "jetpack-joyride": "Jetpack Joyride",
          }

          def extract_version(filename):
              match = re.search(
                  r"\d+\.\d+(?:\.\d+)?(?:-[A-Za-z0-9.-]+)?",
                  Path(filename).stem,
              )
              return match.group(0) if match else ""

          records_dir = Path("build_records")

          if not records_dir.exists():
              raise SystemExit("❌ No build records directory found")

          records = []

          for record_file in sorted(records_dir.glob("*.json")):
              try:
                  with record_file.open("r", encoding="utf-8") as f:
                      records.append(json.load(f))
              except Exception as e:
                  print(f"⚠️ Failed to read {record_file}: {e}")

          if not records:
              raise SystemExit("❌ No build records found")

          # --------------------------------------------------
          # App version
          # --------------------------------------------------

          app_lines = []

          for record in records:
              app_name = record.get("app_name", "")
              version = record.get("resolved_version", "")

              if not app_name or not version:
                  continue

              display_name = APP_NAMES.get(app_name, app_name)
              app_lines.append(f"{display_name}: {version}")

          app_lines = list(dict.fromkeys(app_lines))

          # --------------------------------------------------
          # Patch repository
          # --------------------------------------------------

          patch_lines = []

          for record in records:
              patch_repo = record.get("patch_repo", "").strip()
              patches_file = record.get("patches_file", "").strip()

              if not patch_repo or not patches_file:
                  continue

              patch_version = extract_version(patches_file)

              if not patch_version:
                  continue

              patch_lines.append(
                  f"- {patch_repo}-{patch_version} — "
                  f"[Changelog](https://github.com/{patch_repo}/releases/tag/v{patch_version})"
              )

          patch_lines = list(dict.fromkeys(patch_lines))

          # --------------------------------------------------
          # CLI
          # --------------------------------------------------

          cli_lines = []

          for record in records:
              cli_file = record.get("cli_file", "").strip()

              if not cli_file:
                  continue

              if "morphe" in cli_file.lower():
                  cli_lines.append(f"- MorpheApp/{cli_file}")
              else:
                  cli_lines.append(f"- {cli_file}")

          cli_lines = list(dict.fromkeys(cli_lines))

          # --------------------------------------------------
          # Release notes
          # --------------------------------------------------

          lines = [
              "# Morphe APKs - Latest Build",
              "",
          ]

          lines.extend(app_lines)

          if patch_lines:
              lines.extend([
                  "",
                  "Patches:",
              ])
              lines.extend(patch_lines)

          if cli_lines:
              lines.extend([
                  "",
                  "CLI:",
              ])
              lines.extend(cli_lines)

          Path("release_notes.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )

          print("")
          print("========================================")
          print("📝 Release Notes")
          print("========================================")
          print(Path("release_notes.md").read_text(encoding="utf-8"))
          PY
          
      # ========================================
      # Remove Superseded APK Versions
      # ========================================

      - name: Remove Old APK Versions
        if: ${{ inputs.update_release == true && steps.check-release.outputs.release_exists == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🧹 Checking for superseded APK versions..."

          : > keep_apks.txt

          for apk in ./*.apk; do
            [ -f "$apk" ] || continue
            basename "$apk" >> keep_apks.txt
          done

          echo "Current APKs to keep:"
          cat keep_apks.txt

          if [ -f scripts/cleanup_old_apks.py ]; then
            python scripts/cleanup_old_apks.py \
              --release latest \
              --keep-file keep_apks.txt || \
              echo "⚠️ Cleanup script failed; continuing with upload"
          else
            echo "⚠️ scripts/cleanup_old_apks.py not found"
            echo "⚠️ Skipping old APK cleanup"
          fi

      # ========================================
      # Update Latest Release
      # ========================================

      - name: Update Latest Release
        if: ${{ inputs.update_release == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Updating latest release..."

          apk_count=$(find . -maxdepth 1 -type f -name "*.apk" | wc -l)

          if [ "$apk_count" -eq 0 ]; then
            echo "❌ No APKs found"
            exit 1
          fi

          echo "📦 Releasing $apk_count APK(s)"

          if [ "${{ steps.check-release.outputs.release_exists }}" = "true" ]; then
            echo "⬆️ Uploading APKs to existing release..."

            gh release upload \
              latest \
              ./*.apk \
              --clobber

            echo "📝 Updating release title and notes..."

            gh release edit \
              latest \
              --title "Morphe APKs - Latest Build" \
              --notes-file release_notes.md

          else
            echo "🚀 Creating new latest release..."

            gh release create \
              latest \
              ./*.apk \
              --title "Morphe APKs - Latest Build" \
              --notes-file release_notes.md \
              --latest
          fi

          echo "✅ Release updated successfully!"

      # ========================================
      # Show Release Information
      # ========================================

      - name: Show Release Information
        if: ${{ inputs.update_release == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_url=$(gh release view latest --json url --jq .url)

          echo "========================================"
          echo "🔗 Release URL:"
          echo "$release_url"
          echo "========================================"
          echo ""

          echo "📦 Direct APK links:"

          for apk in ./*.apk; do
            [ -f "$apk" ] || continue

            filename=$(basename "$apk")

            echo "  - $filename:"
            echo "    $release_url/download/$filename"
          done