name: Generate App Configs

on:
  workflow_dispatch:

jobs:
  generate-configs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create Config Files
        run: |
          mkdir -p apps/apkmirror apps/github

          # ==========================
          # APKMirror configs
          # ==========================

          # CamScanner
          echo '{"org":"intsig-pte","name":"camscanner-phone-pdf-creator","type":"BUNDLE","arch":"arm64-v8a","dpi":"nodpi","package":"com.intsig.camscanner","version":""}' > apps/apkmirror/camscanner.json

          # Gboard
          echo '{"org":"google-inc","name":"gboard","type":"APK","arch":"arm64-v8a","dpi":"nodpi","package":"com.google.android.inputmethod.latin","version":""}' > apps/apkmirror/gboard.json

          # Microsoft Edge
          echo '{"org":"microsoft-corporation","name":"microsoft-edge","type":"APK","arch":"arm64-v8a","dpi":"nodpi","package":"com.microsoft.emmx","version":"152.0.4191.65"}' > apps/apkmirror/microsoft-edge.json

          # TikTok
          echo '{"org":"tiktok-pte-ltd","name":"tik-tok-including-musical-ly","type":"APK","arch":"arm64-v8a","dpi":"nodpi","package":"com.zhiliaoapp.musically","version":"46.9.3"}' > apps/apkmirror/tiktok.json

          # Vivaldi
          echo '{"org":"vivaldi-technologies","name":"vivaldi-browser-beta","type":"APKM","arch":"arm64-v8a","dpi":"nodpi","package":"com.vivaldi.browser","version":""}' > apps/apkmirror/vivaldi.json

          # Windy
          echo '{"org":"windy-weather-world-inc","name":"windy","type":"APK","arch":"arm64-v8a","dpi":"nodpi","package":"com.windyty.android","version":""}' > apps/apkmirror/windy.json

          # YouTube Music
          echo '{"org":"google-inc","name":"youtube-music","type":"APK","arch":"arm64-v8a","dpi":"nodpi","package":"com.google.android.apps.youtube.music","version":""}' > apps/apkmirror/youtube-music.json

          # YouTube
          echo '{"org":"google-inc","name":"youtube","type":"APK","arch":"universal","dpi":"nodpi","package":"com.google.android.youtube","version":""}' > apps/apkmirror/youtube.json

          # ==========================
          # GitHub configs
          # ==========================

          # Brave
          echo '{"name":"brave","type":"APK","arch":"arm64-v8a","package":"com.brave.browser","version":"","repo":"brave/brave-browser","tag":"latest","asset_pattern":"bravemonoarm64"}' > apps/github/brave.json

          echo "✅ Configs created for 9 apps"

          echo ""
          echo "APKMirror configs:"
          ls -la apps/apkmirror/*.json

          echo ""
          echo "GitHub configs:"
          ls -la apps/github/*.json

      - name: Commit Configs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add apps/

          if git diff --cached --quiet; then
            echo "No config changes to commit"
            exit 0
          fi

          git commit -m "Update app configs"

          git remote set-url --push origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git push origin HEAD:${GITHUB_REF_NAME}