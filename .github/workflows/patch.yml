name: Auto Build and Release Morphe

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      force_full_rebuild:
        description: "Rebuild every app (ignore incremental check)"
        type: boolean
        required: false
        default: false

  schedule:
    - cron: "0 16 * * *"

jobs:

  # ============================================================
  # CHECK FOR UPDATES
  # ============================================================

  check-updates:
    name: Check for Updates
    runs-on: ubuntu-latest

    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
      build_matrix: ${{ steps.check.outputs.build_matrix }}
      update_count: ${{ steps.check.outputs.update_count }}
      total_count: ${{ steps.check.outputs.total_count }}
      carry_count: ${{ steps.check.outputs.carry_count }}
      incremental: ${{ steps.check.outputs.incremental }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate GitHub Auth
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/validate_github_auth.py

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install requests beautifulsoup4

      - name: Run Incremental Update Check
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_FULL_REBUILD: ${{ inputs.force_full_rebuild || 'false' }}
        run: |
          python scripts/check_app_updates.py

      - name: Show Plan Summary
        run: |
          echo "========================================"
          echo "📋 BUILD PLAN"
          echo "========================================"
          echo "Total entries: ${{ steps.check.outputs.total_count }}"
          echo "Need rebuild:  ${{ steps.check.outputs.update_count }}"
          echo "Carry over:    ${{ steps.check.outputs.carry_count }}"
          echo "Incremental:   ${{ steps.check.outputs.incremental }}"
          echo "Has updates:   ${{ steps.check.outputs.has_updates }}"
          echo "========================================"

      - name: Upload Build Plan
        uses: actions/upload-artifact@v4
        with:
          name: build-plan
          path: |
            build_matrix.json
            carry_over.json
            new_manifest.json
          if-no-files-found: error
          retention-days: 1


  # ============================================================
  # PREPARE BUILD MATRIX
  # ============================================================

  patch-apps:
    name: Prepare Build Matrix
    needs: check-updates

    runs-on: ubuntu-latest

    if: needs.check-updates.outputs.has_updates == 'true'

    outputs:
      matrix: ${{ steps.read-matrix.outputs.matrix }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Build Matrix
        id: read-matrix
        env:
          BUILD_MATRIX: ${{ needs.check-updates.outputs.build_matrix }}
        run: |
          MATRIX="$BUILD_MATRIX"

          if [ -z "$MATRIX" ] || [ "$MATRIX" = "null" ] || [ "$MATRIX" = "[]" ]; then
            echo "❌ Build matrix is empty"
            exit 1
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

          echo "========================================"
          echo "🏗️ BUILD MATRIX"
          echo "========================================"
          echo "$MATRIX"
          echo "========================================"


  # ============================================================
  # BUILD APPLICATIONS
  # ============================================================

  build-apps:
    name: Build Applications

    needs: patch-apps

    runs-on: ubuntu-latest

    permissions:
      contents: write

    services:
      trawl:
        image: ghcr.io/germondai/trawl:latest
        ports:
          - 8191:8191
        options: --shm-size=1gb

    strategy:
      fail-fast: false

      matrix:
        include: ${{ fromJson(needs.patch-apps.outputs.matrix) }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install requests beautifulsoup4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build APK
        env:
          APP_NAME: ${{ matrix.app_name }}
          SOURCE: ${{ matrix.source }}
          ARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRAWL_URL: http://localhost:8191
        run: |
          echo "========================================"
          echo "🔧 BUILDING APPLICATION"
          echo "========================================"
          echo "App:    $APP_NAME"
          echo "Source: $SOURCE"
          echo "Mode:   Automatic version resolution"
          echo "========================================"

          # Small randomized delay to avoid hammering upstream services
          sleep $((RANDOM % 30)).$((RANDOM % 100))

          python -m src

      - name: List Built APKs
        if: always()
        run: |
          echo "========================================"
          echo "📦 BUILT APK FILES"
          echo "========================================"

          find . -maxdepth 1 -type f -name "*.apk" -print \
            || true

      - name: Record Build Outputs
        if: success()
        env:
          APP_NAME: ${{ matrix.app_name }}
          SOURCE: ${{ matrix.source }}
        run: |
          mkdir -p build_records

          found=0

          for apk in ./*.apk; do
            [ -f "$apk" ] || continue

            found=1

            echo "Recording: $(basename "$apk")"

            APK_PATH="$apk" \
            python scripts/record_build.py
          done

          if [ "$found" -eq 0 ]; then
            echo "❌ No APKs were produced"
            exit 1
          fi

          echo ""
          echo "Build records:"
          ls -la build_records/

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.app_name }}-${{ matrix.source }}
          path: "*.apk"
          if-no-files-found: error
          retention-days: 3

      - name: Upload Build Records
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-records-${{ matrix.app_name }}-${{ matrix.source }}
          path: build_records/
          if-no-files-found: error
          retention-days: 3


  # ============================================================
  # CREATE / UPDATE RELEASE
  # ============================================================

  create-single-release:
    name: Create Single Release

    needs:
      - check-updates
      - build-apps

    runs-on: ubuntu-latest

    if: |
      always() &&
      needs.check-updates.outputs.has_updates == 'true' &&
      needs.build-apps.result != 'cancelled'

    permissions:
      contents: write

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Download Build Plan
      # ----------------------------------------------------------

      - name: Download Build Plan
        uses: actions/download-artifact@v4
        with:
          name: build-plan
          path: ./build-plan

      # ----------------------------------------------------------
      # Download APKs
      # ----------------------------------------------------------

      - name: Download Built APKs
        uses: actions/download-artifact@v4
        with:
          path: ./all-apks
          pattern: apk-*
          merge-multiple: true

      # ----------------------------------------------------------
      # Download Build Records
      # ----------------------------------------------------------

      - name: Download Build Records
        uses: actions/download-artifact@v4
        with:
          path: ./all-records
          pattern: build-records-*
          merge-multiple: true
        continue-on-error: true

      # ----------------------------------------------------------
      # Check APKs
      # ----------------------------------------------------------

      - name: Check Built APKs
        id: check-apks
        run: |
          built_count=$(find ./all-apks \
            -type f \
            -name "*.apk" \
            | wc -l)

          echo "Built APKs: $built_count"

          if [ "$built_count" -eq 0 ]; then
            echo "❌ No APKs were built"
            exit 1
          fi

          echo "built_count=$built_count" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------
      # Collect APKs
      # ----------------------------------------------------------

      - name: Collect APKs
        run: |
          mkdir -p release-apks

          find ./all-apks \
            -type f \
            -name "*.apk" \
            -exec cp -f {} ./release-apks/ \;

          echo "========================================"
          echo "📦 APKs READY FOR RELEASE"
          echo "========================================"

          ls -lah release-apks/

      # ----------------------------------------------------------
      # Collect Build Records
      # ----------------------------------------------------------

      - name: Collect Build Records
        run: |
          mkdir -p build_records

          if [ -d "./all-records" ]; then
            find ./all-records \
              -type f \
              -name "*.json" \
              -exec cp -f {} build_records/ \;
          fi

          echo "Build records:"
          ls -lah build_records/ || true

      # ----------------------------------------------------------
      # Build Final Manifest
      # ----------------------------------------------------------

      - name: Build Final Manifest
        run: |
          echo "🧾 Building final manifest..."

          cp ./build-plan/new_manifest.json ./new_manifest.json

          python scripts/merge_manifest.py

          if [ -f manifest.json ]; then
            echo "✅ manifest.json created"

            jq '.entries | length' manifest.json

            cp manifest.json ./release-apks/manifest.json
          else
            echo "❌ manifest.json was not created"
            exit 1
          fi

      # ----------------------------------------------------------
      # Validate GitHub Auth
      # ----------------------------------------------------------

      - name: Validate GitHub Auth
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/validate_github_auth.py

      # ----------------------------------------------------------
      # Check Existing Release
      # ----------------------------------------------------------

      - name: Check Existing Release
        id: check-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ Existing latest release found"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
            echo "📭 No latest release exists"
          fi

      # ----------------------------------------------------------
      # Generate Release Notes
      # ----------------------------------------------------------

      - name: Generate Release Notes
        run: |
          echo "📝 Generating release notes..."

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          APP_NAMES = {
              "adobe-acrobat": "Adobe Acrobat",
              "1-1-1-1": "1.1.1.1",
              "brave": "Brave",
              "camscanner": "CamScanner",
              "capcut": "CapCut",
              "excel": "Microsoft Excel",
              "gboard": "Gboard",
              "google-photos": "Google Photos",
              "hidden-settings": "Hidden Settings",
              "hill-climb-racing": "Hill Climb Racing",
              "jetpack-joyride": "Jetpack Joyride",
              "microsoft-edge": "Microsoft Edge",
              "proton-vpn": "Proton VPN",
              "sd-maid-se": "SD Maid SE",
              "speedtest": "Speedtest",
              "strava": "Strava",
              "tiktok": "TikTok",
              "traffic-rider": "Traffic Rider",
              "vivaldi": "Vivaldi",
              "windy": "Windy",
              "word": "Microsoft Word",
              "youtube": "YouTube",
              "youtube-music": "YT-Music",
          }

          def extract_version(filename):
              match = re.search(
                  r"\d+\.\d+(?:\.\d+)?(?:-[A-Za-z0-9.-]+)?",
                  Path(filename).stem,
              )
              return match.group(0) if match else ""

          records_dir = Path("build_records")

          if not records_dir.exists():
              raise SystemExit("❌ No build records directory found")

          records = []

          for record_file in sorted(records_dir.glob("*.json")):
              try:
                  with record_file.open("r", encoding="utf-8") as f:
                      records.append(json.load(f))
              except Exception as e:
                  print(f"⚠️ Failed to read {record_file}: {e}")

          if not records:
              raise SystemExit("❌ No build records found")

          # ------------------------------------------------------
          # App versions
          # ------------------------------------------------------

          app_lines = []

          for record in records:
              app_name = record.get("app_name", "")
              version = record.get("resolved_version", "")

              if not app_name or not version:
                  continue

              display_name = APP_NAMES.get(app_name, app_name)
              app_lines.append(f"{display_name}: {version}")

          # Remove duplicates while preserving order.
          app_lines = list(dict.fromkeys(app_lines))

          # ------------------------------------------------------
          # Patch repositories
          # ------------------------------------------------------

          patch_lines = []

          for record in records:
              patch_repo = record.get("patch_repo", "").strip()
              patches_file = record.get("patches_file", "").strip()

              if not patch_repo or not patches_file:
                  continue

              patch_version = extract_version(patches_file)

              if not patch_version:
                  continue

              patch_lines.append(
                  f"- {patch_repo}-{patch_version} — "
                  f"[Changelog](https://github.com/{patch_repo}/releases/tag/v{patch_version})"
              )

          patch_lines = list(dict.fromkeys(patch_lines))

          # ------------------------------------------------------
          # CLI files
          # ------------------------------------------------------

          cli_lines = []

          for record in records:
              cli_file = record.get("cli_file", "").strip()

              if not cli_file:
                  continue

              if "morphe" in cli_file.lower():
                  cli_lines.append(f"- MorpheApp/{cli_file}")
              else:
                  cli_lines.append(f"- {cli_file}")

          cli_lines = list(dict.fromkeys(cli_lines))

          # ------------------------------------------------------
          # Build release notes
          # ------------------------------------------------------

          lines = [
              "# Morphe APKs - Latest Build",
              "",
          ]

          lines.extend(app_lines)

          if patch_lines:
              lines.extend([
                  "",
                  "Patches:",
              ])
              lines.extend(patch_lines)

          if cli_lines:
              lines.extend([
                  "",
                  "CLI:",
              ])
              lines.extend(cli_lines)

          Path("release_notes.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )

          print("")
          print(Path("release_notes.md").read_text(encoding="utf-8"))
          PY

      # ----------------------------------------------------------
      # Cleanup Old APK Versions
      # ----------------------------------------------------------

      - name: Cleanup Old APK Versions
        if: steps.check-release.outputs.release_exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🧹 Cleaning superseded APK versions..."

          : > keep_apks.txt

          for apk in ./release-apks/*.apk; do
            [ -f "$apk" ] || continue

            filename=$(basename "$apk")

            # Do not put manifest.json here.
            # cleanup_old_apks.py only operates on APK assets.
            echo "$filename" >> keep_apks.txt
          done

          echo ""
          echo "Keeping:"
          cat keep_apks.txt

          python scripts/cleanup_old_apks.py \
            --release latest \
            --keep-file keep_apks.txt

      # ----------------------------------------------------------
      # Upload / Create Release
      # ----------------------------------------------------------

      - name: Upload Or Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Publishing release..."

          ASSETS=(./release-apks/*.apk)

          if [ -f ./release-apks/manifest.json ]; then
            ASSETS+=(./release-apks/manifest.json)
          fi

          if [ "${{ steps.check-release.outputs.release_exists }}" = "true" ]; then

            echo "⬆️ Updating existing latest release..."

            gh release upload \
              latest \
              "${ASSETS[@]}" \
              --clobber

            gh release edit \
              latest \
              --title "Morphe APKs - Latest Build" \
              --notes-file release_notes.md

          else

            echo "🆕 Creating latest release..."

            gh release create \
              latest \
              "${ASSETS[@]}" \
              --title "Morphe APKs - Latest Build" \
              --notes-file release_notes.md \
              --latest

          fi

          echo "✅ Release published successfully"

      # ----------------------------------------------------------
      # Show Release Information
      # ----------------------------------------------------------

      - name: Display Release URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_url=$(gh release view latest --json url --jq .url)

          echo "========================================"
          echo "🔗 RELEASE"
          echo "========================================"
          echo "$release_url"
          echo ""

          echo "📦 Direct APK Downloads:"

          for apk in ./release-apks/*.apk; do
            [ -f "$apk" ] || continue

            filename=$(basename "$apk")

            echo "$filename"
            echo "$release_url/download/$filename"
            echo ""
          done


  # ============================================================
  # CLEANUP OLD WORKFLOW RUNS
  # ============================================================

  cleanup:
    name: Cleanup Workflow Runs

    needs:
      - build-apps
      - create-single-release

    runs-on: ubuntu-latest

    if: always()

    permissions:
      actions: write

    steps:

      - name: Delete Old Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 3
          keep_minimum_runs: 5

